name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Lint
        run: npm run lint
      
      - name: Run Backend Tests
        run: npm run test -w @saas/api
        env:
          DATABASE_URL: "file:./dev.db"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Run Frontend Tests
        run: npm run test -w @saas/web --if-present

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps --if-present
      - name: Run Playwright tests
        run: npm run test:e2e --if-present
        env:
          DATABASE_URL: "file:./dev.db"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          FRONTEND_URL: http://localhost:3000

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e-tests]
    if: |
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      always() && 
      needs.lint-and-test.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'
          
      - name: Deploy Backend to Railway
        uses: railwayapp/action@master
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
